<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="1080" height="480" fill="#f8fafc"/>
  <text x="30" y="56" font-size="30" font-weight="700" fill="#1f2937">双指针"每列反转"：i 与 k 相向而行</text>
  <text x="30" y="92" font-size="18" fill="#4b5563">以 4 元素列 [1, 5, 9, 13]（n=4）为例。蓝色 i 从顶部出发向下，橙色 k 从底部出发向上，每轮交换一对，直到 i ≥ k 停止。</text>

  <!-- ================= 卡 1：步骤 1 ================= -->
  <g transform="translate(40,130)">
    <rect x="-12" y="-34" width="310" height="268" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="0" y="-12" font-size="19" font-weight="700" fill="#d97706">步骤 1：准备交换</text>

    <rect x="0" y="0" width="60" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="30" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">1</text>
    <text x="74" y="40" font-size="17" font-weight="600" fill="#2563eb">i=0 ↓</text>
    <rect x="0" y="68" width="60" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="108" font-size="26" font-weight="600" text-anchor="middle" fill="#1f2937">5</text>
    <rect x="0" y="136" width="60" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="176" font-size="26" font-weight="600" text-anchor="middle" fill="#1f2937">9</text>
    <rect x="0" y="204" width="60" height="60" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="30" y="244" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">13</text>
    <text x="74" y="244" font-size="17" font-weight="600" fill="#ea580c">k=3 ↑</text>

    <text x="0" y="228" font-size="16" fill="#6b7280">swap(1, 13) → 交换首尾</text>
  </g>

  <!-- ================= 卡 2：步骤 2 ================= -->
  <g transform="translate(400,130)">
    <rect x="-12" y="-34" width="310" height="268" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="0" y="-12" font-size="19" font-weight="700" fill="#d97706">步骤 2：向中间走一步</text>

    <rect x="0" y="0" width="60" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#1f2937">13</text>
    <rect x="0" y="68" width="60" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="30" y="108" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">5</text>
    <text x="74" y="108" font-size="17" font-weight="600" fill="#2563eb">i=1 ↓</text>
    <rect x="0" y="136" width="60" height="60" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="30" y="176" font-size="26" font-weight="700" text-anchor="middle" fill="#1f2937">9</text>
    <text x="74" y="176" font-size="17" font-weight="600" fill="#ea580c">k=2 ↑</text>
    <rect x="0" y="204" width="60" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="244" font-size="26" font-weight="600" text-anchor="middle" fill="#1f2937">1</text>

    <text x="0" y="228" font-size="16" fill="#6b7280">swap(5, 9) → 交换中间一对</text>
  </g>

  <!-- ================= 卡 3：步骤 3 ================= -->
  <g transform="translate(760,130)">
    <rect x="-12" y="-34" width="310" height="268" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="0" y="-12" font-size="19" font-weight="700" fill="#16a34a">步骤 3：i=2 ≥ k=1，停止</text>

    <rect x="0" y="0" width="60" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#1f2937">13</text>
    <rect x="0" y="68" width="60" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="108" font-size="26" font-weight="600" text-anchor="middle" fill="#1f2937">9</text>
    <rect x="0" y="136" width="60" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="176" font-size="26" font-weight="600" text-anchor="middle" fill="#1f2937">5</text>
    <rect x="0" y="204" width="60" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="244" font-size="26" font-weight="600" text-anchor="middle" fill="#1f2937">1</text>

    <text x="0" y="228" font-size="16" font-weight="600" fill="#16a34a">结果 [13, 9, 5, 1] ✓ 完成反转</text>
  </g>

  <line x1="40" y1="424" x2="1040" y2="424" stroke="#e5e7eb" stroke-width="1"/>
  <text x="40" y="452" font-size="17" fill="#6b7280">终止条件 i &lt; k：奇数 n 中间元素不动；偶数 n 每对恰交换一次。写成 i &lt; n 会让每对交换两次 = 等于没反转。</text>
</svg>
