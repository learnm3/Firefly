<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="1080" height="440" fill="#f8fafc"/>
  <text x="30" y="56" font-size="30" font-weight="700" fill="#1f2937">一维滚动数组 dp 的三步演进（uniquePaths(3,4)）</text>
  <text x="30" y="92" font-size="18" fill="#4b5563">同一块内存，三行轮流覆盖：dp[j] 更新前 = 上方（上一行），dp[j-1] 刚更新 = 左方（本行）</text>

  <!-- ================= 卡 1：初始 = 第 0 行 ================= -->
  <g transform="translate(30,130)">
    <rect x="-14" y="-34" width="320" height="262" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <text x="0" y="-12" font-size="19" font-weight="700" fill="#6b7280">初始 = 第 0 行</text>
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#475569">1</text>
    <rect x="70" y="0" width="60" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="100" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#475569">1</text>
    <rect x="140" y="0" width="60" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="170" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#475569">1</text>
    <rect x="210" y="0" width="60" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="240" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#475569">1</text>
    <text x="0" y="88" font-size="16" fill="#6b7280">第 0 行每格只有 1 条路（一直向右）</text>
    <text x="0" y="114" font-size="16" fill="#6b7280">还没进循环，dp = [1, 1, 1, 1]</text>
  </g>

  <!-- ================= 卡 2：i=1 后 = 第 1 行 ================= -->
  <g transform="translate(385,130)">
    <rect x="-14" y="-34" width="320" height="262" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="0" y="-12" font-size="19" font-weight="700" fill="#2563eb">i=1 后 = 第 1 行</text>
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#475569">1</text>
    <rect x="70" y="0" width="60" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="100" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#2563eb">2</text>
    <rect x="140" y="0" width="60" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="170" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#2563eb">3</text>
    <rect x="210" y="0" width="60" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="240" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#2563eb">4</text>
    <text x="0" y="88" font-size="16" fill="#475569">2=1+1　3=1+2　4=1+3</text>
    <text x="0" y="114" font-size="16" fill="#6b7280">旧值被覆盖：dp = [1, 2, 3, 4]</text>
  </g>

  <!-- ================= 卡 3：i=2 后 = 第 2 行 ================= -->
  <g transform="translate(740,130)">
    <rect x="-14" y="-34" width="320" height="262" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="-12" font-size="19" font-weight="700" fill="#b45309">i=2 后 = 第 2 行</text>
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="40" font-size="26" font-weight="600" text-anchor="middle" fill="#475569">1</text>
    <rect x="70" y="0" width="60" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="100" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#2563eb">3</text>
    <rect x="140" y="0" width="60" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="170" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#2563eb">6</text>
    <rect x="210" y="0" width="60" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/><text x="240" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#b45309">10</text>
    <text x="0" y="88" font-size="16" fill="#475569">3=2+1　6=3+3　10=4+6</text>
    <text x="0" y="114" font-size="16" font-weight="600" fill="#b45309">答案 dp[3] = 10 ✓</text>
  </g>

  <line x1="30" y1="410" x2="1050" y2="410" stroke="#e5e7eb" stroke-width="1"/>
  <text x="30" y="432" font-size="17" fill="#6b7280">关键：蓝框格子 = 本轮新覆盖的值（用它覆盖上一行旧值）；第 0 列（灰）永远不变，所以内层循环 j 从 1 开始，从 0 开始就会访问 dp[-1] 越界。</text>
</svg>
