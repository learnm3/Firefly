<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="1080" height="600" fill="#f7f8fa"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1f2937">215 数组中的第 K 个最大元素：小顶堆流转（k = 2）</text>
  <text x="30" y="66" font-size="14" fill="#4b5563">nums = [3,2,1,5,6,4]。堆里永远只留"当前最大的 k 个"；堆顶 = 第 k 大 = 候选门槛。遍历一遍，堆顶即答案。</text>

  <!-- 头部图例 -->
  <g transform="translate(30,86)">
    <rect x="0" y="0" width="52" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="26" y="26" font-size="13" text-anchor="middle" fill="#1f2937">新元素</text>
    <rect x="90" y="0" width="44" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="112" y="26" font-size="13" text-anchor="middle" fill="#ea580c" font-weight="700">堆顶</text>
    <text x="120" y="26" font-size="12" fill="#6b7280">堆顶 = 门槛（候选席里最小的）</text>
  </g>

  <!-- 第 1 步：x=3 -->
  <g transform="translate(30,150)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#2563eb">①</text>
    <rect x="40" y="0" width="52" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="66" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">3</text>
    <text x="108" y="16" font-size="14" fill="#94a3b8">→</text>
    <rect x="140" y="0" width="44" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="162" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">3</text>
    <rect x="188" y="0" width="44" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4,3"/><text x="210" y="26" font-size="13" text-anchor="middle" fill="#cbd5e1">空</text>
    <text x="260" y="20" font-size="13.5" fill="#374151">堆空 → push 3 → 堆 [3]（不够 2 个，先收着）</text>
  </g>

  <!-- 第 2 步：x=2 -->
  <g transform="translate(30,200)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#2563eb">②</text>
    <rect x="40" y="0" width="52" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="66" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">2</text>
    <text x="108" y="16" font-size="14" fill="#94a3b8">→</text>
    <rect x="140" y="0" width="44" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="162" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">2</text>
    <rect x="188" y="0" width="44" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="210" y="26" font-size="15" text-anchor="middle" fill="#1f2937">3</text>
    <text x="260" y="20" font-size="13.5" fill="#374151">push 2 → 堆 [2,3]（堆顶 = 2，此刻 2 是前两名的门槛）</text>
  </g>

  <!-- 第 3 步：x=1 -->
  <g transform="translate(30,250)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#2563eb">③</text>
    <rect x="40" y="0" width="52" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="66" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">1</text>
    <text x="108" y="16" font-size="14" fill="#94a3b8">→</text>
    <rect x="140" y="0" width="44" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="162" y="26" font-size="15" text-anchor="middle" fill="#1f2937">2</text>
    <rect x="188" y="0" width="44" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="210" y="26" font-size="15" text-anchor="middle" fill="#1f2937">3</text>
    <text x="260" y="12" font-size="13.5" fill="#dc2626" font-weight="700">push 1 → [1,2,3] 超 2 个</text>
    <text x="260" y="30" font-size="13.5" fill="#dc2626">→ pop 堆顶 1 → [2,3]（1 进候选席就被踢出）</text>
  </g>

  <!-- 第 4 步：x=5 -->
  <g transform="translate(30,300)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#2563eb">④</text>
    <rect x="40" y="0" width="52" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="66" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">5</text>
    <text x="108" y="16" font-size="14" fill="#94a3b8">→</text>
    <rect x="140" y="0" width="44" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="162" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">3</text>
    <rect x="188" y="0" width="44" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="210" y="26" font-size="15" text-anchor="middle" fill="#1f2937">5</text>
    <text x="260" y="20" font-size="13.5" fill="#374151">push 5 → [2,3,5] → pop 2 → [3,5]（2 被 5 挤出前二）</text>
  </g>

  <!-- 第 5 步：x=6 -->
  <g transform="translate(30,350)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#2563eb">⑤</text>
    <rect x="40" y="0" width="52" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="66" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">6</text>
    <text x="108" y="16" font-size="14" fill="#94a3b8">→</text>
    <rect x="140" y="0" width="44" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="162" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">5</text>
    <rect x="188" y="0" width="44" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="210" y="26" font-size="15" text-anchor="middle" fill="#1f2937">6</text>
    <text x="260" y="20" font-size="13.5" fill="#374151">push 6 → [3,5,6] → pop 3 → [5,6]（3 被 6 挤出前二）</text>
  </g>

  <!-- 第 6 步：x=4 -->
  <g transform="translate(30,400)">
    <text x="0" y="14" font-size="13" font-weight="700" fill="#2563eb">⑥</text>
    <rect x="40" y="0" width="52" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="66" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937">4</text>
    <text x="108" y="16" font-size="14" fill="#94a3b8">→</text>
    <rect x="140" y="0" width="44" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="162" y="26" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">5</text>
    <rect x="188" y="0" width="44" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="210" y="26" font-size="15" text-anchor="middle" fill="#1f2937">6</text>
    <text x="260" y="12" font-size="13.5" fill="#dc2626" font-weight="700">push 4 → [4,5,6] 超 2 个</text>
    <text x="260" y="30" font-size="13.5" fill="#dc2626">→ pop 堆顶 4 → [5,6]（4 比门槛 5 小？不，4 进来后自己成了最小被踢出）</text>
  </g>

  <!-- 结果 -->
  <g transform="translate(30,452)">
    <text x="0" y="16" font-size="14" font-weight="700" fill="#16a34a">结果</text>
    <rect x="60" y="0" width="44" height="40" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/><text x="82" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#16a34a">5</text>
    <rect x="108" y="0" width="44" height="40" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/><text x="130" y="26" font-size="16" font-weight="700" text-anchor="middle" fill="#16a34a">6</text>
    <text x="180" y="22" font-size="14" fill="#16a34a">堆 [5,6] 就是最大的 2 个 → 堆顶 5 = 第 2 大 ✅（6 是第 1 大）</text>
  </g>

  <!-- 底部说明 -->
  <rect x="30" y="512" width="1020" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="536" font-size="14" font-weight="700" fill="#1d4ed8">为什么用小顶堆：</text>
  <text x="48" y="558" font-size="13.5" fill="#374151">第 k 大 = "前 k 名里的最后一名" = 候选席门槛。小顶堆的堆顶恰好是最小的，用它当门槛最自然；大顶堆留不住前 k 个。</text>
  <text x="48" y="576" font-size="13" fill="#6b7280">复杂度：时间 O(n log k)（每元素一次 O(log k) 堆操作）、空间 O(k)。面试另一种答法：快速选择（快排 partition）平均 O(n)。</text>
</svg>
