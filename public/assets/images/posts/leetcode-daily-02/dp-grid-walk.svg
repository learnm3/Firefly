<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="1080" height="470" fill="#f7f8fa"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1f2937">62 不同路径：DP 填表逐步演示（3×3 实例）</text>
  <text x="30" y="66" font-size="14" fill="#4b5563">核心：dp[i][j] = 上方格 + 左方格（每个格子问"我是被谁走到的？"）；边界 = 1</text>

  <!-- ============ 左区：3×3 网格（完整结果） ============ -->
  <text x="30" y="106" font-size="15" font-weight="700" fill="#1f2937">完整填表结果（每格 = 到达该格的走法数）</text>
  <g transform="translate(30,120)">
    <!-- 行 0 -->
    <rect x="0" y="0" width="56" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="28" y="34" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="60" y="0" width="56" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="88" y="34" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="120" y="0" width="56" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="148" y="34" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2937">1</text>
    <!-- 行 1 -->
    <rect x="0" y="60" width="56" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="28" y="94" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="60" y="60" width="56" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="88" y="94" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">2</text>
    <rect x="120" y="60" width="56" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="148" y="94" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">3</text>
    <!-- 行 2 -->
    <rect x="0" y="120" width="56" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="28" y="154" font-size="17" font-weight="600" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="60" y="120" width="56" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="88" y="154" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937">3</text>
    <rect x="120" y="120" width="56" height="56" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="148" y="154" font-size="19" font-weight="700" text-anchor="middle" fill="#ea580c">6</text>
    <!-- 标注 -->
    <text x="-8" y="-10" font-size="12" fill="#6b7280">(0,0) 起点</text>
    <text x="124" y="-10" font-size="12" fill="#6b7280">(2,2) 终点</text>
  </g>
  <!-- 路径示例 -->
  <text x="30" y="300" font-size="14" fill="#374151">终点 6 = 上方 3 + 左方 3；数字 6 就是"从左上到右下一共有 6 条走法"。</text>
  <text x="30" y="322" font-size="13" fill="#6b7280">边界（第一行/第一列）只能直走，所以全是 1。</text>

  <!-- ============ 中区：关键格计算推导 ============ -->
  <text x="300" y="106" font-size="15" font-weight="700" fill="#1f2937">每个内部格子 = 上方 + 左方</text>
  <g transform="translate(300,128)">
    <!-- 计算 (1,1) -->
    <rect x="0" y="0" width="46" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="23" y="26" font-size="14" text-anchor="middle" fill="#1f2937">上:1</text>
    <rect x="0" y="46" width="46" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="23" y="72" font-size="14" text-anchor="middle" fill="#1f2937">左:1</text>
    <text x="20" y="101" font-size="15" font-weight="700" text-anchor="middle" fill="#f59e0b">+</text>
    <rect x="52" y="60" width="52" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="78" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">= 2</text>
    <text x="78" y="42" font-size="12" fill="#6b7280">(1,1)</text>

    <!-- 计算 (1,2) -->
    <rect x="170" y="0" width="46" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="193" y="26" font-size="14" text-anchor="middle" fill="#1f2937">上:1</text>
    <rect x="170" y="46" width="46" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="193" y="72" font-size="14" text-anchor="middle" fill="#1f2937">左:2</text>
    <text x="190" y="101" font-size="15" font-weight="700" text-anchor="middle" fill="#f59e0b">+</text>
    <rect x="222" y="60" width="52" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="248" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">= 3</text>
    <text x="248" y="42" font-size="12" fill="#6b7280">(1,2)</text>

    <!-- 计算 (2,1) -->
    <rect x="340" y="0" width="46" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="363" y="26" font-size="14" text-anchor="middle" fill="#1f2937">上:2</text>
    <rect x="340" y="46" width="46" height="40" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="363" y="72" font-size="14" text-anchor="middle" fill="#1f2937">左:1</text>
    <text x="360" y="101" font-size="15" font-weight="700" text-anchor="middle" fill="#f59e0b">+</text>
    <rect x="392" y="60" width="52" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="418" y="86" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">= 3</text>
    <text x="418" y="42" font-size="12" fill="#6b7280">(2,1)</text>

    <!-- 计算 (2,2) -->
    <rect x="510" y="0" width="46" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="533" y="26" font-size="14" text-anchor="middle" fill="#1f2937">上:3</text>
    <rect x="510" y="46" width="46" height="40" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/><text x="533" y="72" font-size="14" text-anchor="middle" fill="#1f2937">左:3</text>
    <text x="530" y="101" font-size="15" font-weight="700" text-anchor="middle" fill="#ea580c">+</text>
    <rect x="562" y="60" width="52" height="40" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="588" y="86" font-size="16" font-weight="700" text-anchor="middle" fill="#ea580c">= 6</text>
    <text x="588" y="42" font-size="12" fill="#6b7280">(2,2) 答案</text>
  </g>

  <!-- ============ 右区：滚动数组优化 ============ -->
  <text x="720" y="106" font-size="15" font-weight="700" fill="#1f2937">滚动数组：一行数组走完整个表</text>
  <g transform="translate(720,128)">
    <text x="0" y="22" font-size="13" fill="#374151">① 初始（第一行）：</text>
    <rect x="0" y="30" width="44" height="34" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="22" y="53" font-size="14" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="48" y="30" width="44" height="34" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="70" y="53" font-size="14" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="96" y="30" width="44" height="34" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="118" y="53" font-size="14" text-anchor="middle" fill="#1f2937">1</text>

    <text x="0" y="94" font-size="13" fill="#374151">② 算第 2 行：dp[j] += dp[j-1]</text>
    <rect x="0" y="102" width="44" height="34" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="22" y="125" font-size="14" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="48" y="102" width="44" height="34" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="70" y="125" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">2</text>
    <rect x="96" y="102" width="44" height="34" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="118" y="125" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">3</text>
    <text x="150" y="124" font-size="12" fill="#6b7280">= [1,2,3]（第 2 行）</text>

    <text x="0" y="166" font-size="13" fill="#374151">③ 算第 3 行：</text>
    <rect x="0" y="174" width="44" height="34" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="22" y="197" font-size="14" text-anchor="middle" fill="#1f2937">1</text>
    <rect x="48" y="174" width="44" height="34" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="70" y="197" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">3</text>
    <rect x="96" y="174" width="44" height="34" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="118" y="197" font-size="15" font-weight="700" text-anchor="middle" fill="#ea580c">6</text>
    <text x="150" y="196" font-size="12" fill="#6b7280">= [1,3,6] → 答案 dp[2]=6</text>

    <text x="0" y="240" font-size="12.5" fill="#374151">为什么对：上一轮的 dp[j] 是"上方格"的值，</text>
    <text x="0" y="258" font-size="12.5" fill="#374151">dp[j-1] 是本轮刚算完的"左方格"的值，</text>
    <text x="0" y="276" font-size="12.5" fill="#374151">加完 dp[j] 就变成当前格 —— 原地滚动。</text>
  </g>

  <!-- ============ 底部结论 ============ -->
  <rect x="30" y="360" width="1020" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="48" y="390" font-size="15" font-weight="700" fill="#1d4ed8">结论</text>
  <text x="48" y="414" font-size="14" fill="#374151">答案 = dp[m-1][n-1] = dp[2][2] = 6（3×3 网格共 6 种走法）。组合数公式：C(m+n-2, m-1) = C(4, 2) = 6 —— DP 与数学殊途同归。</text>
  <text x="48" y="436" font-size="13" fill="#6b7280">变体：63 不同路径 II（障碍格 dp 置 0）；64 最小路径和（把 + 换成 min，比较上方/左方谁更小）。</text>
</svg>
