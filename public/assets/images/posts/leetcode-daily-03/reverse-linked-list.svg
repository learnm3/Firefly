<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="system-ui, sans-serif">
  <rect width="1080" height="660" fill="#ffffff"/>
  <text x="24" y="38" font-size="24" font-weight="700" fill="#111827">206 反转链表 · 三指针逐步演示（1→2→3→4→5 反转）</text>
  <text x="24" y="62" font-size="14" fill="#6B7280">口诀：先存 nxt 再掉头，三针齐步走。橙色 = 已反转部分，灰色 = 未处理部分，⊥ = nullptr</text>

  <!-- 帧0：初始 -->
  <g>
    <rect x="24" y="92" width="1030" height="80" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
    <text x="40" y="112" font-size="13" font-weight="700" fill="#374151">初始</text>
    <text x="40" y="132" font-size="12" fill="#EF4444" font-weight="700">prev = ⊥</text>
    <text x="150" y="132" font-size="12" fill="#2563EB" font-weight="700">cur →</text>
    <text x="260" y="132" font-size="12" fill="#F59E0B" font-weight="700">nxt →</text>
    <rect x="40" y="142" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="72" y="164" text-anchor="middle" font-size="14" fill="#ffffff">1</text>
    <rect x="116" y="142" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="148" y="164" text-anchor="middle" font-size="14" fill="#ffffff">2</text>
    <rect x="192" y="142" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="224" y="164" text-anchor="middle" font-size="14" fill="#ffffff">3</text>
    <rect x="268" y="142" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="300" y="164" text-anchor="middle" font-size="14" fill="#ffffff">4</text>
    <rect x="344" y="142" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="376" y="164" text-anchor="middle" font-size="14" fill="#ffffff">5</text>
    <line x1="104" y1="158" x2="116" y2="158" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <line x1="180" y1="158" x2="192" y2="158" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <line x1="256" y1="158" x2="268" y2="158" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <line x1="332" y1="158" x2="344" y2="158" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <text x="700" y="130" font-size="13" fill="#6B7280">① 先记 nxt = cur-&gt;next（防断链）</text>
    <text x="700" y="150" font-size="13" fill="#6B7280">② cur-&gt;next = prev（掉头）</text>
  </g>

  <!-- 帧1 -->
  <g>
    <rect x="24" y="184" width="1030" height="80" rx="8" fill="#FFF7ED" stroke="#F59E0B"/>
    <text x="40" y="204" font-size="13" font-weight="700" fill="#374151">第 1 步后</text>
    <text x="40" y="224" font-size="12" fill="#2563EB" font-weight="700">prev → 1</text>
    <text x="140" y="224" font-size="12" fill="#EF4444" font-weight="700">cur → 2</text>
    <text x="250" y="224" font-size="12" fill="#F59E0B" font-weight="700">nxt → 3</text>
    <rect x="40" y="234" width="64" height="32" rx="6" fill="#F59E0B"/>
    <text x="72" y="256" text-anchor="middle" font-size="14" fill="#ffffff">1</text>
    <rect x="116" y="234" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="148" y="256" text-anchor="middle" font-size="14" fill="#ffffff">2</text>
    <rect x="192" y="234" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="224" y="256" text-anchor="middle" font-size="14" fill="#ffffff">3</text>
    <rect x="268" y="234" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="300" y="256" text-anchor="middle" font-size="14" fill="#ffffff">4</text>
    <rect x="344" y="234" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="376" y="256" text-anchor="middle" font-size="14" fill="#ffffff">5</text>
    <text x="90" y="270" text-anchor="middle" font-size="11" fill="#B45309">⊥</text>
    <line x1="180" y1="250" x2="192" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <line x1="256" y1="250" x2="268" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <line x1="332" y1="250" x2="344" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <text x="700" y="222" font-size="13" fill="#6B7280">1-&gt;next 已指向 ⊥，2 成新 cur</text>
  </g>

  <!-- 帧2 -->
  <g>
    <rect x="24" y="276" width="1030" height="80" rx="8" fill="#FFF7ED" stroke="#F59E0B"/>
    <text x="40" y="296" font-size="13" font-weight="700" fill="#374151">第 2 步后</text>
    <text x="40" y="316" font-size="12" fill="#2563EB" font-weight="700">prev → 2</text>
    <text x="140" y="316" font-size="12" fill="#EF4444" font-weight="700">cur → 3</text>
    <text x="250" y="316" font-size="12" fill="#F59E0B" font-weight="700">nxt → 4</text>
    <rect x="116" y="326" width="64" height="32" rx="6" fill="#F59E0B"/>
    <text x="148" y="348" text-anchor="middle" font-size="14" fill="#ffffff">2</text>
    <rect x="40" y="326" width="64" height="32" rx="6" fill="#F59E0B"/>
    <text x="72" y="348" text-anchor="middle" font-size="14" fill="#ffffff">1</text>
    <rect x="192" y="326" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="224" y="348" text-anchor="middle" font-size="14" fill="#ffffff">3</text>
    <rect x="268" y="326" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="300" y="348" text-anchor="middle" font-size="14" fill="#ffffff">4</text>
    <rect x="344" y="326" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="376" y="348" text-anchor="middle" font-size="14" fill="#ffffff">5</text>
    <line x1="104" y1="342" x2="40" y2="342" stroke="#F59E0B" stroke-width="2"/>
    <text x="72" y="362" text-anchor="middle" font-size="11" fill="#B45309">⊥</text>
    <line x1="256" y1="342" x2="268" y2="342" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <line x1="332" y1="342" x2="344" y2="342" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <text x="700" y="314" font-size="13" fill="#6B7280">2-&gt;next = 1，已反转链 2→1</text>
  </g>

  <!-- 帧3 -->
  <g>
    <rect x="24" y="368" width="1030" height="80" rx="8" fill="#FFF7ED" stroke="#F59E0B"/>
    <text x="40" y="388" font-size="13" font-weight="700" fill="#374151">第 3 步后</text>
    <text x="40" y="408" font-size="12" fill="#2563EB" font-weight="700">prev → 3</text>
    <text x="140" y="408" font-size="12" fill="#EF4444" font-weight="700">cur → 4</text>
    <text x="250" y="408" font-size="12" fill="#F59E0B" font-weight="700">nxt → 5</text>
    <rect x="192" y="418" width="64" height="32" rx="6" fill="#F59E0B"/>
    <text x="224" y="440" text-anchor="middle" font-size="14" fill="#ffffff">3</text>
    <rect x="116" y="418" width="64" height="32" rx="6" fill="#F59E0B"/>
    <text x="148" y="440" text-anchor="middle" font-size="14" fill="#ffffff">2</text>
    <rect x="40" y="418" width="64" height="32" rx="6" fill="#F59E0B"/>
    <text x="72" y="440" text-anchor="middle" font-size="14" fill="#ffffff">1</text>
    <rect x="268" y="418" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="300" y="440" text-anchor="middle" font-size="14" fill="#ffffff">4</text>
    <rect x="344" y="418" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="376" y="440" text-anchor="middle" font-size="14" fill="#ffffff">5</text>
    <text x="72" y="454" text-anchor="middle" font-size="11" fill="#B45309">⊥</text>
    <line x1="256" y1="434" x2="268" y2="434" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <line x1="332" y1="434" x2="344" y2="434" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
    <text x="700" y="406" font-size="13" fill="#6B7280">3-&gt;next = 2，已反转链 3→2→1</text>
  </g>

  <!-- 帧4 -->
  <g>
    <rect x="24" y="460" width="1030" height="80" rx="8" fill="#FFF7ED" stroke="#F59E0B"/>
    <text x="40" y="480" font-size="13" font-weight="700" fill="#374151">第 4 步后</text>
    <text x="40" y="500" font-size="12" fill="#2563EB" font-weight="700">prev → 4</text>
    <text x="140" y="500" font-size="12" fill="#EF4444" font-weight="700">cur → 5</text>
    <text x="250" y="500" font-size="12" fill="#F59E0B" font-weight="700">nxt → ⊥</text>
    <rect x="268" y="510" width="64" height="32" rx="6" fill="#F59E0B"/>
    <text x="300" y="532" text-anchor="middle" font-size="14" fill="#ffffff">4</text>
    <rect x="192" y="510" width="64" height="32" rx="6" fill="#F59E0B"/>
    <text x="224" y="532" text-anchor="middle" font-size="14" fill="#ffffff">3</text>
    <rect x="116" y="510" width="64" height="32" rx="6" fill="#F59E0B"/>
    <text x="148" y="532" text-anchor="middle" font-size="14" fill="#ffffff">2</text>
    <rect x="40" y="510" width="64" height="32" rx="6" fill="#F59E0B"/>
    <text x="72" y="532" text-anchor="middle" font-size="14" fill="#ffffff">1</text>
    <rect x="344" y="510" width="64" height="32" rx="6" fill="#9CA3AF"/>
    <text x="376" y="532" text-anchor="middle" font-size="14" fill="#ffffff">5</text>
    <text x="72" y="546" text-anchor="middle" font-size="11" fill="#B45309">⊥</text>
    <text x="700" y="498" font-size="13" fill="#6B7280">4-&gt;next = 3，cur = 5（最后节点）</text>
  </g>

  <!-- 帧5：完成 -->
  <g>
    <rect x="24" y="552" width="1030" height="84" rx="8" fill="#ECFDF5" stroke="#10B981"/>
    <text x="40" y="574" font-size="13" font-weight="700" fill="#047857">完成</text>
    <text x="40" y="594" font-size="12" fill="#EF4444" font-weight="700">cur = ⊥（循环结束）</text>
    <text x="180" y="594" font-size="12" fill="#2563EB" font-weight="700">return prev = 5</text>
    <rect x="344" y="602" width="64" height="32" rx="6" fill="#10B981"/>
    <text x="376" y="624" text-anchor="middle" font-size="14" fill="#ffffff">5</text>
    <rect x="268" y="602" width="64" height="32" rx="6" fill="#10B981"/>
    <text x="300" y="624" text-anchor="middle" font-size="14" fill="#ffffff">4</text>
    <rect x="192" y="602" width="64" height="32" rx="6" fill="#10B981"/>
    <text x="224" y="624" text-anchor="middle" font-size="14" fill="#ffffff">3</text>
    <rect x="116" y="602" width="64" height="32" rx="6" fill="#10B981"/>
    <text x="148" y="624" text-anchor="middle" font-size="14" fill="#ffffff">2</text>
    <rect x="40" y="602" width="64" height="32" rx="6" fill="#10B981"/>
    <text x="72" y="624" text-anchor="middle" font-size="14" fill="#ffffff">1</text>
    <text x="72" y="638" text-anchor="middle" font-size="11" fill="#047857">⊥</text>
    <text x="700" y="592" font-size="13" fill="#047857">新链表 5→4→3→2→1→⊥</text>
  </g>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
