<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" font-family="system-ui, sans-serif">
  <rect width="1080" height="740" fill="#ffffff"/>
  <text x="24" y="36" font-size="24" font-weight="700" fill="#111827">155 最小栈 · 双栈逐步演示（主栈 st + 同步最小值栈 minSt）</text>
  <text x="24" y="60" font-size="14" fill="#6B7280">minSt 每个位置 = "到当前高度为止的最小值"。操作序列：push(-2) push(0) push(-3) push(5) pop() pop() → getMin()</text>

  <!-- 重复值陷阱说明 -->
  <rect x="540" y="76" width="516" height="92" rx="8" fill="#FFF1F2" stroke="#F43F5E"/>
  <text x="556" y="98" font-size="14" font-weight="700" fill="#BE123C">为什么 push 必须用 &lt;=（重复最小值陷阱）</text>
  <text x="556" y="120" font-size="13" fill="#374151">push(1) push(1) 后用 &lt;=：两个 1 都入 minSt=[1,1]</text>
  <text x="556" y="140" font-size="13" fill="#374151">pop() 时顶 1 == 1 同步弹一次 → minSt=[1] → getMin() 仍 1 ✓</text>
  <text x="556" y="160" font-size="13" fill="#BE123C">若用 &lt;：第二个 1 不入，pop 时唯一记录被弹掉 → minSt 空，getMin 崩</text>

  <!-- 表头 -->
  <text x="40" y="188" font-size="14" font-weight="700" fill="#111827">操作</text>
  <text x="250" y="188" font-size="14" font-weight="700" fill="#2563EB">主栈 st（栈顶在上）</text>
  <text x="390" y="188" font-size="14" font-weight="700" fill="#10B981">minSt（栈顶在上）</text>
  <text x="560" y="188" font-size="14" font-weight="700" fill="#111827">同步规则</text>
  <line x1="24" y1="196" x2="1056" y2="196" stroke="#E5E7EB" stroke-width="2"/>

  <!-- 行1 -->
  <g>
    <rect x="24" y="206" width="1056" height="88" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="40" y="258" font-size="14" font-weight="700" fill="#111827">① push(-2)</text>
    <rect x="250" y="258" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="272" text-anchor="middle" font-size="12" fill="#1E40AF">-2</text>
    <rect x="390" y="258" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="272" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <text x="560" y="272" font-size="13" fill="#374151">空栈：新低 -2 直接入 minSt</text>
  </g>

  <!-- 行2 -->
  <g>
    <rect x="24" y="302" width="1056" height="88" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="40" y="354" font-size="14" font-weight="700" fill="#111827">② push(0)</text>
    <rect x="250" y="336" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="350" text-anchor="middle" font-size="12" fill="#1E40AF">0</text>
    <rect x="250" y="354" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="368" text-anchor="middle" font-size="12" fill="#1E40AF">-2</text>
    <rect x="390" y="336" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="350" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <rect x="390" y="354" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="368" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <text x="560" y="368" font-size="13" fill="#374151">0 &gt; -2：最小值没变，minSt 不入（复制 -2 表示"至今最小仍是 -2"）</text>
  </g>

  <!-- 行3 -->
  <g>
    <rect x="24" y="398" width="1056" height="88" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="40" y="450" font-size="14" font-weight="700" fill="#111827">③ push(-3)</text>
    <rect x="250" y="414" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="428" text-anchor="middle" font-size="12" fill="#1E40AF">-3</text>
    <rect x="250" y="432" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="446" text-anchor="middle" font-size="12" fill="#1E40AF">0</text>
    <rect x="250" y="450" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="464" text-anchor="middle" font-size="12" fill="#1E40AF">-2</text>
    <rect x="390" y="414" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="428" text-anchor="middle" font-size="12" fill="#065F46">-3</text>
    <rect x="390" y="432" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="446" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <rect x="390" y="450" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="464" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <text x="560" y="464" font-size="13" fill="#374151">-3 ≤ -2：新低，入 minSt（关键：minSt 顶部永远等于 st 顶部为止的最小值）</text>
  </g>

  <!-- 行4 -->
  <g>
    <rect x="24" y="494" width="1056" height="88" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="40" y="546" font-size="14" font-weight="700" fill="#111827">④ push(5)</text>
    <rect x="250" y="492" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="506" text-anchor="middle" font-size="12" fill="#1E40AF">5</text>
    <rect x="250" y="510" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="524" text-anchor="middle" font-size="12" fill="#1E40AF">-3</text>
    <rect x="250" y="528" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="542" text-anchor="middle" font-size="12" fill="#1E40AF">0</text>
    <rect x="250" y="546" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="560" text-anchor="middle" font-size="12" fill="#1E40AF">-2</text>
    <rect x="390" y="492" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="506" text-anchor="middle" font-size="12" fill="#065F46">-3</text>
    <rect x="390" y="510" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="524" text-anchor="middle" font-size="12" fill="#065F46">-3</text>
    <rect x="390" y="528" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="542" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <rect x="390" y="546" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="560" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <text x="560" y="560" font-size="13" fill="#374151">5 &gt; -3：最小值没变，minSt 不入（又复制 -3）</text>
  </g>

  <!-- 行5 -->
  <g>
    <rect x="24" y="590" width="1056" height="88" rx="8" fill="#FFF7ED" stroke="#F59E0B"/>
    <text x="40" y="642" font-size="14" font-weight="700" fill="#111827">⑤ pop()</text>
    <rect x="250" y="628" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="642" text-anchor="middle" font-size="12" fill="#1E40AF">-3</text>
    <rect x="250" y="646" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="660" text-anchor="middle" font-size="12" fill="#1E40AF">0</text>
    <rect x="250" y="664" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="678" text-anchor="middle" font-size="12" fill="#1E40AF">-2</text>
    <rect x="390" y="628" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="642" text-anchor="middle" font-size="12" fill="#065F46">-3</text>
    <rect x="390" y="646" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="660" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <rect x="390" y="664" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="678" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <text x="560" y="678" font-size="13" fill="#374151">弹出的 5 ≠ minSt 顶 -3：minSt 不弹（5 本来就不是最小值记录）</text>
  </g>

  <!-- 行6 -->
  <g>
    <rect x="24" y="686" width="1056" height="46" rx="8" fill="#F0FDF4" stroke="#10B981"/>
    <text x="40" y="716" font-size="14" font-weight="700" fill="#111827">⑥ pop() → getMin() = <tspan font-size="16" fill="#10B981">-2</tspan></text>
    <rect x="250" y="702" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="716" text-anchor="middle" font-size="12" fill="#1E40AF">0</text>
    <rect x="250" y="720" width="46" height="18" rx="4" fill="#DBEAFE"/><text x="273" y="734" text-anchor="middle" font-size="12" fill="#1E40AF">-2</text>
    <rect x="390" y="702" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="716" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <rect x="390" y="720" width="46" height="18" rx="4" fill="#D1FAE5"/><text x="413" y="734" text-anchor="middle" font-size="12" fill="#065F46">-2</text>
    <text x="560" y="716" font-size="13" fill="#374151">弹出的 -3 == minSt 顶 -3：同步弹 → st 顶 = 0，minSt 顶 = -2 = 当前最小 ✓</text>
  </g>
</svg>
