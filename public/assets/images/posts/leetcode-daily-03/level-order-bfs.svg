<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="system-ui, sans-serif">
  <rect width="1080" height="660" fill="#ffffff"/>
  <text x="24" y="38" font-size="24" font-weight="700" fill="#111827">102 二叉树的层序遍历 · BFS 队列逐步演示（树 [3,9,20,null,null,15,7]）</text>
  <text x="24" y="62" font-size="14" fill="#6B7280">核心：每层先拍快照 sz = q.size()，只处理本层 sz 个节点，下一层自然切分</text>

  <!-- 左侧：二叉树 -->
  <g>
    <text x="24" y="100" font-size="15" font-weight="700" fill="#2563EB">原始二叉树（层序数组表示）</text>
    <line x1="150" y1="150" x2="90" y2="215" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="170" y1="150" x2="240" y2="215" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="255" y1="230" x2="215" y2="295" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="255" y1="230" x2="300" y2="295" stroke="#9CA3AF" stroke-width="2"/>
    <circle cx="160" cy="135" r="24" fill="#2563EB"/>
    <text x="160" y="141" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700">3</text>
    <circle cx="90" cy="230" r="22" fill="#E5E7EB" stroke="#9CA3AF"/>
    <text x="90" y="236" text-anchor="middle" font-size="14" fill="#374151">9</text>
    <text x="60" y="268" font-size="12" fill="#9CA3AF">(无孩子)</text>
    <circle cx="255" cy="230" r="22" fill="#E5E7EB" stroke="#9CA3AF"/>
    <text x="255" y="236" text-anchor="middle" font-size="14" fill="#374151">20</text>
    <circle cx="215" cy="310" r="22" fill="#F59E0B"/>
    <text x="215" y="316" text-anchor="middle" font-size="14" fill="#ffffff">15</text>
    <circle cx="300" cy="310" r="22" fill="#F59E0B"/>
    <text x="300" y="316" text-anchor="middle" font-size="14" fill="#ffffff">7</text>
    <text x="24" y="365" font-size="13" fill="#6B7280">层序数组: [3, 9, 20, null, null, 15, 7]</text>
    <text x="24" y="385" font-size="13" fill="#6B7280">层1 [3] → 层2 [9,20] → 层3 [15,7]</text>
  </g>

  <!-- 右侧：队列快照 -->
  <g>
    <text x="420" y="100" font-size="15" font-weight="700" fill="#10B981">BFS 队列快照（左出右进，橙色 = 正在弹出的节点）</text>

    <!-- 帧1 -->
    <rect x="420" y="118" width="630" height="82" rx="8" fill="#F0FDF4" stroke="#10B981"/>
    <text x="436" y="142" font-size="14" font-weight="700" fill="#111827">① 初始：层1 快照 sz=1，弹 3</text>
    <rect x="436" y="154" width="44" height="34" rx="6" fill="#F59E0B"/>
    <text x="458" y="177" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">3</text>
    <rect x="486" y="154" width="44" height="34" rx="6" fill="#D1FAE5"/>
    <text x="508" y="177" text-anchor="middle" font-size="14" fill="#065F46">9</text>
    <rect x="536" y="154" width="44" height="34" rx="6" fill="#D1FAE5"/>
    <text x="558" y="177" text-anchor="middle" font-size="14" fill="#065F46">20</text>
    <text x="596" y="177" font-size="13" fill="#065F46">入队 9、20 → 层1 = [3]</text>

    <!-- 帧2 -->
    <rect x="420" y="210" width="630" height="82" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
    <text x="436" y="234" font-size="14" font-weight="700" fill="#111827">② 层2 快照 sz=2：弹 9（无孩子，不入队）</text>
    <rect x="436" y="246" width="44" height="34" rx="6" fill="#F59E0B"/>
    <text x="458" y="269" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">9</text>
    <rect x="486" y="246" width="44" height="34" rx="6" fill="#D1FAE5"/>
    <text x="508" y="269" text-anchor="middle" font-size="14" fill="#065F46">20</text>
    <text x="546" y="269" font-size="13" fill="#6B7280">→ 层2 = [9]</text>

    <!-- 帧3 -->
    <rect x="420" y="302" width="630" height="82" rx="8" fill="#F0FDF4" stroke="#10B981"/>
    <text x="436" y="326" font-size="14" font-weight="700" fill="#111827">③ 弹 20 → 入队其孩子 15、7</text>
    <rect x="436" y="338" width="44" height="34" rx="6" fill="#F59E0B"/>
    <text x="458" y="361" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">20</text>
    <rect x="486" y="338" width="44" height="34" rx="6" fill="#D1FAE5"/>
    <text x="508" y="361" text-anchor="middle" font-size="14" fill="#065F46">15</text>
    <rect x="536" y="338" width="44" height="34" rx="6" fill="#D1FAE5"/>
    <text x="558" y="361" text-anchor="middle" font-size="14" fill="#065F46">7</text>
    <text x="596" y="361" font-size="13" fill="#065F46">→ 层2 = [9,20] ✓</text>

    <!-- 帧4 -->
    <rect x="420" y="394" width="630" height="82" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
    <text x="436" y="418" font-size="14" font-weight="700" fill="#111827">④ 层3 快照 sz=2：弹 15、7（都无孩子）</text>
    <rect x="436" y="430" width="44" height="34" rx="6" fill="#F59E0B"/>
    <text x="458" y="453" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">15</text>
    <rect x="486" y="430" width="44" height="34" rx="6" fill="#F59E0B"/>
    <text x="508" y="453" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">7</text>
    <text x="546" y="453" font-size="13" fill="#6B7280">→ 层3 = [15,7]</text>

    <!-- 结果 -->
    <rect x="420" y="492" width="630" height="100" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text x="436" y="520" font-size="15" font-weight="700" fill="#2563EB">最终答案（逐层收集）</text>
    <text x="436" y="548" font-size="16" fill="#111827">ans = [ [3], [9,20], [15,7] ]</text>
    <text x="436" y="572" font-size="13" fill="#374151">关键：for 循环只跑 sz 次 → 队列剩余 = 下一层节点，天然分层</text>
  </g>
</svg>
